<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#496f9d" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="refresh"
      content="2;url=https://medical-raghad-h.onrender.com/"
    />
    <link rel="canonical" href="https://medical-raghad-h.onrender.com/" />
    <title>عيادة د. رغد حسين</title>
    <style>
      :root {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        color: #2d4561;
        background: #f7f2ea;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 15%, #e8f0f8 0 10%, transparent 30%),
          #f7f2ea;
      }
      main {
        width: min(470px, 100%);
        padding: 42px 30px;
        border: 1px solid #e6ddd2;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 20px 55px rgba(66, 77, 91, 0.12);
        text-align: center;
      }
      .mark {
        width: 58px;
        height: 58px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 17px;
        color: #fff;
        background: #496f9d;
        box-shadow: 0 10px 24px rgba(73, 111, 157, 0.25);
        font-size: 32px;
      }
      h1 {
        margin: 0;
        font-size: clamp(24px, 7vw, 32px);
      }
      p {
        margin: 12px 0 24px;
        color: #7b8794;
        line-height: 1.7;
      }
      a {
        min-height: 48px;
        padding: 12px 22px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background: #496f9d;
        text-decoration: none;
        font-weight: 800;
      }
      a:focus-visible {
        outline: 3px solid rgba(73, 111, 157, 0.35);
        outline-offset: 3px;
      }
      small {
        display: block;
        margin-top: 18px;
        color: #9b9389;
      }
      @media (prefers-reduced-motion: no-preference) {
        .mark {
          animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse {
          50% {
            transform: scale(1.05);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✚</div>
      <h1>عيادة د. رغد حسين</h1>
      <p>يتم الآن فتح نظام إدارة العيادة الآمن.</p>
      <a href="https://medical-raghad-h.onrender.com/">فتح النظام</a>
      <small>إذا لم يتم الانتقال تلقائياً، اضغط على الزر.</small>
    </main>
    <script>
      window.setTimeout(function () {
        window.location.replace("https://medical-raghad-h.onrender.com/");
      }, 1200);
    </script>
  </body>
</html>
